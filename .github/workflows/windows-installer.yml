name: Publish Windows app update

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify repository and release version
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($p.version)"
          if ($p.build.publish.provider -ne 'github' -or !$p.build.publish.owner -or !$p.build.publish.repo) {
            throw 'GitHub publish repository is missing in package.json.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME must equal $tag"
          }
          if ($p.build.publish.owner -ne $env:GITHUB_REPOSITORY_OWNER) {
            throw 'Owner mismatch.'
          }
          $repoName = $env:GITHUB_REPOSITORY.Split('/')[1]
          if ($p.build.publish.repo -ne $repoName) { throw 'Repository mismatch.' }
          Write-Host "Building $tag for $env:GITHUB_REPOSITORY"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test calendar and update configuration
        run: npm test

      - name: Build Windows NSIS without publishing
        run: npm run build:win

      - name: Generate update metadata from the exact installer
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $name = "KuunsKanbanCalendar-Setup-$($pkg.version)-x64.exe"
          $installer = Join-Path 'dist' $name
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer missing: $installer"
          }
          $info = Get-Item -LiteralPath $installer
          if ($info.Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
          $hash = [Convert]::ToBase64String(
            [Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($info.FullName))
          )
          $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $lines = @(
            "version: $($pkg.version)"
            'files:'
            "  - url: $name"
            "    sha512: $hash"
            "    size: $($info.Length)"
            "path: $name"
            "sha512: $hash"
            "releaseDate: '$stamp'"
          )
          $dest = Join-Path $PWD 'dist/latest.yml'
          [IO.File]::WriteAllLines($dest, [string[]]$lines, [Text.UTF8Encoding]::new($false))
          Write-Host "Verified installer and created $dest"

      - name: Publish verified assets to one tagged GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($pkg.version)"
          $repo = $env:GITHUB_REPOSITORY
          $exeName = "KuunsKanbanCalendar-Setup-$($pkg.version)-x64.exe"
          $installer = Join-Path 'dist' $exeName
          $metadata = Join-Path 'dist' 'latest.yml'
          $blockmap = "$installer.blockmap"
          foreach ($file in @($installer, $metadata)) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing required release asset: $file" }
          }
          $null = gh release view $tag --repo $repo --json id --jq '.id' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --verify-tag --title $tag --notes "KUN'S KANBAN CALENDAR $tag"
            if ($LASTEXITCODE -ne 0) { throw "Unable to create GitHub Release $tag" }
          }
          $assets = @($installer, $metadata)
          if (Test-Path -LiteralPath $blockmap) { $assets += $blockmap }
          gh release upload $tag @assets --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw "Release asset upload failed: $tag" }
          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed: $tag" }
          $actual = @(gh release view $tag --repo $repo --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw "Cannot inspect uploaded assets: $tag" }
          foreach ($name in @($exeName, 'latest.yml')) {
            if ($actual -notcontains $name) {
              throw "RELEASE INCOMPLETE: $name is missing from $tag"
            }
          }
          Write-Host "Release $tag verified: EXE and latest.yml are in the same release."
