name: Publish Windows app update

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify repository and release version
        run: |
          $p = Get-Content package.json -Raw | ConvertFrom-Json
          $tag = "v$($p.version)"
          if ($p.build.publish.provider -ne 'github' -or !$p.build.publish.owner -or !$p.build.publish.repo) {
            throw 'GitHub publish repository is missing in package.json.'
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
            throw "Tag $env:GITHUB_REF_NAME must equal $tag"
          }
          if ($p.build.publish.owner -ne $env:GITHUB_REPOSITORY_OWNER) {
            throw 'Owner mismatch.'
          }
          $repoName = $env:GITHUB_REPOSITORY.Split('/')[1]
          if ($p.build.publish.repo -ne $repoName) { throw 'Repository mismatch.' }
          Write-Host "Building $tag for $env:GITHUB_REPOSITORY"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test calendar and update configuration
        run: npm test

      - name: Build Windows NSIS without publishing
        run: npm run build:win

      - name: Generate update metadata from the exact installer
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $name = "KuunsKanbanCalendar-Setup-$($pkg.version)-x64.exe"
          $installer = Join-Path 'dist' $name
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer missing: $installer"
          }
          $info = Get-Item -LiteralPath $installer
          if ($info.Length -lt 1000000) { throw 'Installer is unexpectedly small.' }
          $hash = [Convert]::ToBase64String(
            [Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($info.FullName))
          )
          $stamp = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $lines = @(
            "version: $($pkg.version)"
            'files:'
            "  - url: $name"
            "    sha512: $hash"
            "    size: $($info.Length)"
            "path: $name"
            "sha512: $hash"
            "releaseDate: '$stamp'"
          )
          $dest = Join-Path $PWD 'dist/latest.yml'
          [IO.File]::WriteAllLines($dest, [string[]]$lines, [Text.UTF8Encoding]::new($false))
          Write-Host "Verified installer and created $dest"

      

      - name: Publish verified assets to one tagged GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$v"
          $exe = "dist/KuunsKanbanCalendar-Setup-$v-x64.exe"
          $metadata = "dist/latest.yml"

          if (!(Test-Path $exe)) { throw "Installer missing: $exe" }
          if (!(Test-Path $metadata)) { throw "latest.yml missing" }

          gh release view $tag -R $env:GITHUB_REPOSITORY 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag -R $env:GITHUB_REPOSITORY --title $v --notes "Windows update $tag"
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }

          $files = @($exe, $metadata)
          if (Test-Path "$exe.blockmap") {
            $files += "$exe.blockmap"
          }

          gh release upload $tag @files --clobber -R $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Asset upload failed" }

          $names = @(gh release view $tag -R $env:GITHUB_REPOSITORY --json assets --jq ".assets[].name")
          if ($LASTEXITCODE -ne 0) { throw "Asset verification failed" }

          if (($names -notcontains [System.IO.Path]::GetFileName($exe)) -or ($names -notcontains "latest.yml")) {
            throw "Release is missing required update files"
          }

          Write-Host "Release $tag verified successfully"

  # The Windows job creates the tagged Release and its latest.yml first.
  # Upload only the macOS DMG from this job: an unsigned Mac test build must
  # NOT publish latest-mac.yml or claim to support signed macOS auto-updates.
  mac-release:
    name: Build macOS Universal DMG (test / unsigned)
    needs: windows-release
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify release tag
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match v$version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Test calendar
        run: npm test

      - name: Build unsigned Universal DMG for Mac testing
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac

      - name: Verify Mac application ad-hoc signature
        run: |
          set -euo pipefail
          app_path=$(find dist -maxdepth 3 -type d -name '*.app' -print -quit)
          if [[ -z "$app_path" ]]; then
            echo "Could not locate .app in dist directory" >&2
            exit 1
          fi
          echo "Checking $app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature=$(codesign -dv --verbose=4 "$app_path" 2>&1)
          echo "$signature" | grep -F 'Signature=adhoc'
          echo "Ad-hoc signature verified (NOT an Apple Developer ID signature)."

      - name: Check macOS executable and helper bundle names
        run: |
          set -euo pipefail
          app_path=$(find dist -maxdepth 3 -type d -name '*.app' -print -quit)
          test -n "$app_path" || { echo "Missing .app" >&2; exit 1; }
          plist="$app_path/Contents/Info.plist"
          bundle_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$plist")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$plist")
          echo "Bundle name: $bundle_name; executable: $executable"
          test "$bundle_name" = 'KuunsKanbanCalendar' || { echo 'CFBundleName is not the expected ASCII name' >&2; exit 1; }
          test -x "$app_path/Contents/MacOS/$executable" || { echo 'Main binary missing' >&2; exit 1; }
          for suffix in '' ' (GPU)' ' (Plugin)' ' (Renderer)'; do
            helper="$app_path/Contents/Frameworks/$bundle_name Helper$suffix.app"
            test -d "$helper" || { echo "Missing helper: $helper" >&2; exit 1; }
            helper_exe=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$helper/Contents/Info.plist")
            test -x "$helper/Contents/MacOS/$helper_exe" || { echo "Missing helper binary: $helper_exe" >&2; exit 1; }
          done
          echo 'macOS app/helper names are consistent.'

      - name: Launch built Mac app on macOS 26 Apple Silicon
        run: |
          set -euo pipefail
          app_path=$(find dist -maxdepth 3 -type d -name '*.app' -print -quit)
          exe_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")
          log_path="$RUNNER_TEMP/kuuns-mac-launch.log"
          export ELECTRON_ENABLE_LOGGING=1
          "$app_path/Contents/MacOS/$exe_name" >"$log_path" 2>&1 &
          app_pid=$!
          sleep 12
          if ! kill -0 "$app_pid" 2>/dev/null; then
            echo 'ERROR: packaged macOS app quit during startup; log follows:' >&2
            cat "$log_path" >&2 || true
            wait "$app_pid" || true
            exit 1
          fi
          echo 'macOS packaged app remained running for 12 seconds.'
          kill "$app_pid" || true
          wait "$app_pid" || true

      - name: Verify and upload Mac DMG to the existing Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          dmg="dist/KuunsKanbanCalendar-$version-mac-universal.dmg"
          test -s "$dmg" || { echo "Missing Mac installer: $dmg" >&2; exit 1; }
          bytes=$(stat -f %z "$dmg")
          if [[ "$bytes" -lt 1000000 ]]; then
            echo "Mac installer is unexpectedly small" >&2
            exit 1
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$tag" "$dmg" -R "$GITHUB_REPOSITORY" --clobber
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$(basename "$dmg")"
          echo "Mac test installer uploaded: $dmg"
